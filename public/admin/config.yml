# Sveltia CMS (Decap-compatible). Login method for the GitHub backend:
# verify the current options in the Sveltia docs before handing over to the client.
backend:
  name: github
  repo: Steff91/krojacka-radionica-site
  branch: main

# Uploads go to public/ so the CMS preview works; switch to src/assets
# once real photos arrive if Astro image optimization (AVIF/WebP, srcset) is needed.
media_folder: public/uploads
public_folder: /uploads

# Bilingual site: Serbian (default, site root) and English (/en/).
# Services and legal pages live in <folder>/sr/<key>.md and <folder>/en/<key>.md — the editor shows both side by side.
# Language-specific settings (hours, directions, process, featured work) are separate entries per language below.
i18n:
  structure: multiple_folders
  locales: [sr, en]
  default_locale: sr

collections:
  - name: settings
    label: Podešavanja
    files:
      - name: info
        label: Kontakt i mreže (oba jezika)
        file: src/data/info.json
        fields:
          - { name: name, label: Naziv, widget: string }
          - { name: address, label: Adresa, widget: string }
          - { name: addressNote, label: Dodatak adresi (npr. TC Kula), widget: string, required: false }
          - { name: mapsLink, label: Link ka Google mapama, widget: string, required: false }
          - { name: mapsEmbed, label: "Google mapa — embed URL (bez API ključa)", widget: string, required: false }
          - { name: phone, label: Telefon (prikaz), widget: string }
          - { name: phoneHref, label: Telefon (link, +381...), widget: string }
          - { name: email, label: Email, widget: string }
          - { name: instagram, label: Instagram URL, widget: string }
          - { name: instagramHandle, label: Instagram nalog (@...), widget: string }
          - { name: pinterest, label: Pinterest URL, widget: string, required: false }
          - { name: youtube, label: YouTube URL, widget: string, required: false }
          - { name: googleReviews, label: Google profil (link za utiske), widget: string, required: false }
          - { name: googleWriteReview, label: Google link za ostavljanje utiska, widget: string, required: false }
          - { name: googleRating, label: Google ocena (npr. 5.0), widget: string, required: false }
          - { name: googleReviewCount, label: Broj Google utisaka, widget: string, required: false }
          - { name: formAction, label: Adresa za slanje forme (npr. Formspree), widget: string, required: false }

      - name: site_sr
        label: Radno vreme, slogan, kako do nas (SR)
        file: src/data/sr/site.json
        fields: &site_fields
          - { name: tagline, label: Slogan, widget: string }
          - { name: address, label: "Adresa (samo ako se razlikuje od zajedničke, npr. 'unit 93' na engleskom)", widget: string, required: false }
          - { name: city, label: Grad, widget: string }
          - name: hours
            label: Radno vreme
            widget: list
            fields:
              - { name: day, label: Dani, widget: string }
              - { name: time, label: Vreme, widget: string }
              - { name: closed, label: Zatvoreno (ne prikazuj u traci na vrhu), widget: boolean, required: false, default: false }
          - name: directions
            label: Kako do nas
            widget: list
            required: false
            fields:
              - { name: title, label: Naslov, widget: string }
              - { name: text, label: Tekst, widget: text }

      - name: site_en
        label: Radno vreme, slogan, kako do nas (EN)
        file: src/data/en/site.json
        fields: *site_fields

      - name: process_sr
        label: Proces rada (SR)
        file: src/data/sr/process.json
        fields: &process_fields
          - name: steps
            label: Koraci
            widget: list
            fields:
              - { name: title, label: Naslov, widget: string }
              - { name: text, label: Tekst, widget: text }

      - name: process_en
        label: Proces rada (EN)
        file: src/data/en/process.json
        fields: *process_fields

      - name: work_sr
        label: Izabrani radovi — slajder (SR)
        file: src/data/sr/work.json
        fields: &work_fields
          - name: items
            label: Fotografije
            widget: list
            fields:
              - { name: src, label: Fotografija, widget: image, required: false }
              - { name: alt, label: Opis fotografije, widget: string }
              - { name: position, label: "Fokus kadra (npr. 50% 20%)", widget: string, required: false }

      - name: work_en
        label: Izabrani radovi — slajder (EN)
        file: src/data/en/work.json
        fields: *work_fields

      - name: testimonials
        label: Utisci klijenata (slajder)
        file: src/content/testimonials.json
        fields:
          - name: items
            label: Utisci
            widget: list
            root: true
            fields:
              - { name: id, label: ID (bez razmaka), widget: string }
              - { name: name, label: Ime klijenta, widget: string }
              - { name: text, label: "Tekst — srpski (ako nema, prikazuje se engleski)", widget: text, required: false }
              - { name: textEn, label: "Tekst — engleski (ako nema, prikazuje se srpski)", widget: text, required: false }
              - { name: rating, label: Ocena, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { name: featured, label: Prikaži u slajderu, widget: boolean, default: true }

  - name: services
    label: Usluge
    folder: src/content/services
    i18n: true
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Naziv, widget: string, i18n: true }
      - { name: urlSlug, label: "Adresa stranice (npr. wedding-dresses)", widget: string, required: false, i18n: true }
      - { name: shortLabel, label: Kratak naziv (filter na stranici Radovi), widget: string, required: false, i18n: true }
      - { name: order, label: Redosled, widget: number, value_type: int, i18n: duplicate }
      - { name: excerpt, label: Kratak opis (kartica), widget: string, i18n: true }
      - { name: seoTitle, label: SEO naslov, widget: string, required: false, i18n: true }
      - { name: seoDescription, label: SEO opis, widget: text, required: false, i18n: true }
      - { name: heroTitle, label: Naslov, widget: string, i18n: true }
      - { name: heroTitleEm, label: Naslov – nastavak (kurziv), widget: string, required: false, i18n: true }
      - { name: intro, label: Uvod, widget: text, i18n: true }
      - { name: image, label: Glavna fotografija, widget: image, required: false, i18n: duplicate }
      - { name: imageLabel, label: Opis fotografije (dok nema slike), widget: string, required: false, i18n: true }
      - name: variant
        label: Izgled
        widget: select
        default: default
        i18n: duplicate
        options:
          - { label: Standardna usluga, value: default }
          - { label: Istaknuta (modni brend), value: featured }
      - { name: itemsEyebrow, label: "Šta šijemo — labela", widget: string, required: false, i18n: true }
      - { name: itemsTitle, label: "Šta šijemo — naslov", widget: string, required: false, i18n: true }
      - name: items
        label: "Šta šijemo — kartice"
        widget: list
        required: false
        i18n: true
        fields:
          - { name: title, label: Naziv, widget: string }
          - { name: text, label: Opis, widget: text }
      - { name: galleryTitle, label: Naslov galerije, widget: string, required: false, i18n: true }
      - name: gallery
        label: "Galerija (fotografije dodati u obe jezičke verzije)"
        widget: list
        required: false
        i18n: true
        fields:
          - { name: src, label: Fotografija, widget: image, required: false }
          - { name: alt, label: Opis fotografije, widget: string }
          - { name: position, label: "Fokus kadra (npr. 50% 20%)", widget: string, required: false }
          - { name: inWorks, label: Prikaži i na stranici Radovi, widget: boolean, required: false, default: true }
      - name: faq
        label: Česta pitanja
        widget: list
        required: false
        i18n: true
        fields:
          - { name: q, label: Pitanje, widget: string }
          - { name: a, label: Odgovor, widget: text }
      - { name: body, label: Dodatni tekst, widget: markdown, required: false, i18n: true }

  - name: blog
    label: Blog (samo srpski)
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    summary: "{{date}} · {{title}}"
    fields:
      - { name: title, label: Naslov, widget: string }
      - { name: description, label: Kratak opis (kartica i pretraživači), widget: text }
      - { name: date, label: Datum objave, widget: datetime, time_format: false, format: YYYY-MM-DD, date_format: DD.MM.YYYY }
      - { name: updated, label: Datum izmene, widget: datetime, time_format: false, format: YYYY-MM-DD, date_format: DD.MM.YYYY, required: false }
      - { name: category, label: Kategorija, widget: string, default: Saveti }
      - { name: image, label: Naslovna fotografija, widget: image, required: false }
      - { name: imageAlt, label: Opis fotografije, widget: string, required: false }
      - { name: author, label: Autor, widget: string, default: Slađana }
      - { name: draft, label: Nacrt (ne objavljuj), widget: boolean, default: false }
      - { name: body, label: Tekst, widget: markdown }

  - name: legal
    label: Pravne stranice
    folder: src/content/legal
    i18n: true
    create: false
    delete: false
    fields:
      - { name: title, label: Naslov, widget: string, i18n: true }
      - { name: urlSlug, label: "Adresa stranice (npr. privacy-policy)", widget: string, required: false, i18n: true }
      - { name: description, label: Opis (za pretraživače), widget: string, i18n: true }
      - { name: updated, label: Poslednja izmena, widget: string, i18n: true }
      - { name: body, label: Tekst, widget: markdown, i18n: true }
